name: Deploy Android

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  deploy-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5   # Updated to v5 (or latest major)

      # 1. Setup Java (Required for Android builds and signing)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Download and install Godot 4.6 stable (Linux Headless version)
      - name: Download Godot Engine
        run: |
          curl -LO https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip Godot_v4.6-stable_linux.x86_64.zip
          sudo mv Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot
          
          # Download Export Templates
          curl -LO https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable
          unzip Godot_v4.6-stable_export_templates.tpz -d /tmp
          mv /tmp/templates/* ~/.local/share/godot/export_templates/4.6.stable/

      # 3. Export the project to an APK via Godot CLI
      - name: Godot Headless Export to Android
        run: |
          mkdir -p build/android
          cd godot
          godot --headless --path . --export-debug "Android" ../build/android/hello-shooter-game.apk
          cd ..

      # 4. Sign the APK using jarsigner (requires keystore secret)
      # - name: Sign APK
      #   if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      #   run: |
      #     echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > build/android/release.keystore
          
      #     jarsigner -verbose \
      #       -sigalg SHA256withRSA \
      #       -digestalg SHA-256 \
      #       -keystore build/android/release.keystore \
      #       -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
      #       -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
      #       build/android/hello-shooter-game.apk \
      #       "${{ secrets.ANDROID_KEY_ALIAS }}"

      # 5. Upload the APK artifact so it can be downloaded from the GitHub Actions run
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4   # Ensure this is bumped if a newer major version is available, or check runner compatibility
        with:
          name: hello-shooter-game-apk
          path: build/android/hello-shooter-game.apk

      # 6. Create GitHub Release and upload APK
      - name: Release APK to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/android/hello-shooter-game.apk
          generate_release_notes: true